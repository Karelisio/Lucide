name: Build Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  build:
    name: Build & sign release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Compute app version
        id: version
        run: |
          VERSION_NAME=$(node -p "require('./changelog.json')[0].version")
          VERSION_CODE="${{ github.run_number }}"
          echo "Version calculée : $VERSION_NAME (code $VERSION_CODE)"

          # Sur un push de tag v*, le tag doit correspondre à la version en tête de
          # changelog.json — ça évite de publier une release sans changelog à jour,
          # ou avec un numéro de version qui ne correspond à rien.
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_VERSION="${GITHUB_REF#refs/tags/v}"
            if [ "$TAG_VERSION" != "$VERSION_NAME" ]; then
              echo "::error::Le tag v$TAG_VERSION ne correspond pas à la version en tête de changelog.json ($VERSION_NAME). Ajoute une entrée $TAG_VERSION dans changelog.json avant de pousser ce tag."
              exit 1
            fi
          fi

          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

      - name: Build release notes from changelog
        id: notes
        run: |
          {
            echo "body<<CHANGELOG_EOF"
            node -e "const c=require('./changelog.json')[0]; console.log(c.notes.map(n => '- ' + n).join('\n'))"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Le secret ANDROID_KEYSTORE_BASE64 est manquant — voir le README pour générer et configurer le keystore."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore

      - name: Write keystore.properties
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > android/keystore.properties <<EOF
          storeFile=app/release.keystore
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          keyPassword=${ANDROID_KEY_PASSWORD}
          EOF

      - name: Build signed release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Locate APK
        id: apk
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::Aucun APK trouvé après le build."
            exit 1
          fi
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Clean up keystore
        if: always()
        run: rm -f android/app/release.keystore android/keystore.properties

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lucide-release-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "Lucide v${{ steps.version.outputs.name }}"
          body: ${{ steps.notes.outputs.body }}
          files: ${{ steps.apk.outputs.path }}
